<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Pacarku - Bunga Cinta</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ffe6f2, #ffb3d9);
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        h1 {
            font-size: 3em;
            color: #ff69b4;
            animation: fadeInUp 2s ease-out;
            margin-bottom: 20px;
        }
        .flower {
            width: 300px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
            margin: 20px auto;
        }
        .ghibli-img {
            width: 250px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: slideIn 2s ease-out;
            margin: 20px auto;
        }
        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin: 20px 0;
            animation: fadeIn 3s ease-in 1s both;
        }
        .sleep-message {
            font-size: 1.5em;
            color: #ff69b4;
            font-style: italic;
            animation: blink 2s infinite;
            margin: 30px 0;
        }
        .heart {
            font-size: 4em;
            color: #ff1493;
            animation: pulse 2s infinite;
            display: inline-block;
            margin: 20px 0;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .petals {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffb3d9;
            border-radius: 50%;
            animation: fall 5s linear infinite;
        }
        .petal:nth-child(1) { left: 10%; animation-delay: 0s; }
        .petal:nth-child(2) { left: 20%; animation-delay: 1s; }
        .petal:nth-child(3) { left: 30%; animation-delay: 2s; }
        .petal:nth-child(4) { left: 40%; animation-delay: 3s; }
        .petal:nth-child(5) { left: 50%; animation-delay: 4s; }
        @keyframes fall {
            from { top: -20px; opacity: 1; }
            to { top: 100vh; opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="petals">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>
    <div class="container">
        <h1>Good Sleep AQIS!</h1>
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Bunga Romantis" class="flower">
        <img src="https://i.pinimg.com/originals/8a/8a/8a/8a8a8a8a8a8a8a8a8a8a8a8a8a8a8a8a.jpg" alt="Totoro dari Studio Ghibli" class="ghibli-img">
        <p>Semoga tidur dengan nyenyak dan ngga ada yang aneh-aneh lagi. 🌸</p>
        <p>dan semoga besok ada hal-hal yang baik untuk kamu.</p>
        <div class="sleep-message">"Silahkakn beri nilai website yang bagas buat ini hihihi"</div>
        <div class="heart">❤️</div>
    </div>
</body>
</html>
